# 도구 설정만 둔다 (패키지 빌드 안 함). Lead 소유.
[tool.ruff]
target-version = "py311"
line-length = 120
# ref/·eval/v1/은 원본 그대로 보존하는 참고용 복사본이라 lint 대상에서 뺀다
extend-exclude = ["ref", "eval/v1", ".worktrees", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ASYNC"]
# 한국어 프롬프트 문자열이 길어 줄 길이는 검사하지 않는다 (파일 길이는 check.sh가 경고)
ignore = ["E501"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
pythonpath = ["."]
